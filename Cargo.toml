[package]
name = "k4fq"
version = "0.1.0"
edition = "2021"
rust-version = "1.91.1"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# command line parsing
clap = { version = "4.5.51", features = ["cargo", "derive"] }
# provides progress bar and log messages
indicatif = "0.17.11"
predicates = "3.1.3"
rdkafka = { version = "0.37.0", features = ["cmake-build"] }
serde = "1.0.228"
serde_json = "1.0.145"
erased-serde = "0.4.9"
config = "0.13.4"
rayon = '1.11'
tokio = { version = "1.35.1", features = ["full"] }
itertools = "0.12.1"
uuid = { version = "1.18.1", features = ["v4", "fast-rng", "macro-diagnostics"] }
futures = { version = "0.3.4" }
async-trait = "0.1.75"
log = "0.4.28"

[dev-dependencies]
# latest version - 0.12.0 doesn't contain kafka, so I used latest dev instead
#testcontainers = { git="https://github.com/testcontainers/testcontainers-rs.git", ref="4b6b59f8fccd51cca812662df1701a3186a87b1f" }
testcontainers = "0.15.0"
testcontainers-modules = {  version = "0.3.7", features = ["kafka"] }
# nice matching for enums
assert_matches = "1.5"
# for testing for combinations of command line arguments
proptest = "1.9.0"

# nice tool for mocking and stubbing
mockall = "0.12.1"
